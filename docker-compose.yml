version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fantasy-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fantasy
      POSTGRES_PASSWORD: fantasy_dev_password
      POSTGRES_DB: fantasy_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fantasy']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
